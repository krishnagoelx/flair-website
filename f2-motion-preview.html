solute;top:25%;left:33%;width:42%;height:2px;background:#b7c9b8;transform-origin:left;animation:route 6.5s ease-in-out infinite}.catalog{position:absolute;left:10%;right:8%;top:38%;height:42%;display:flex;gap:3%;align-items:center;justify-content:center;perspective:750px}.tile{position:relative;width:22%;height:92%;border:1px solid #d8e3d8;border-radius:15px;background:white;box-shadow:0 14px 27px #3c4f3b24;display:grid;place-items:center;animation:tile 6.5s cubic-bezier(.22,.8,.25,1.14) infinite;overflow:hidden}.tile img{width:98%;height:93%;object-fit:contain}.tile:nth-child(1){animation-delay:.06s}.tile:nth-child(2){animation-delay:.18s}.tile:nth-child(3){animation-delay:.3s}.tile:nth-child(4){animation-delay:.42s}.bad{position:absolute;bottom:-3%;left:8%;right:8%;height:21%;border-radius:10px;background:#fff;box-shadow:0 9px 15px #3338;display:grid;place-items:center;opacity:0;animation:bad 6.5s ease infinite}.bad svg{width:28px;height:28px;stroke:#a99896;stroke-width:3;fill:none}.tile:nth-child(2){animation-name:tilebad}.tile:nth-child(4){animation-name:tilebad2}.shelf{position:absolute;left:20%;right:16%;top:26%;bottom:12%;border:1px solid #cddccd;border-radius:17px;background:#fff;box-shadow:0 24px 40px #2e453126;opacity:0;transform:translateY(30px) scale(.9);animation:shelf 6.5s cubic-bezier(.2,.8,.2,1.1) infinite;display:flex;align-items:center;justify-content:space-around;padding:4%;gap:4%;z-index:5}.shelf .pick{height:86%;width:43%;border:1px solid #e1e8de;border-radius:11px;display:grid;place-items:center;background:#fff}.shelf .pick:first-child{border-color:#a9c6ae;box-shadow:0 9px 16px #2c54301c}.shelf img{width:95%;height:88%;object-fit:contain}.shelf .select{position:absolute;bottom:6%;left:22%;width:26%;height:6px;border-radius:5px;background:#a8bda9}.feedback{position:absolute;left:49%;bottom:4%;width:2px;height:20%;background:#b6cbb7;transform-origin:bottom;opacity:0;animation:feedback 6.5s ease-in-out infinite}
